<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" class="diagram-svg" role="img" aria-labelledby="title-acp desc-acp"><title id="title-acp">Acp</title><desc id="desc-acp">Agent Client Protocol separates editor integration from coding agent implementation. Compatible agent A can change to agent B while the editor keeps the shared interface.</desc><style>
.svg-node{fill:var(--surface,#16212c);stroke:var(--line,#3c4d5f);stroke-width:1.6}
.svg-title{fill:var(--ink,#f2efe7);font:600 24px system-ui,sans-serif;letter-spacing:-.4px}
.svg-small{fill:var(--dim,#adb9c6);font:18px system-ui,sans-serif}
.svg-mono{fill:var(--dim,#adb9c6);font:16px ui-monospace,monospace}
.svg-large{fill:var(--ink,#f2efe7);font:600 42px system-ui,sans-serif;letter-spacing:-1px}
.edge{fill:none;stroke:var(--line,#3c4d5f);stroke-width:2}
.svg-model{stroke:var(--model,#ffbb71)}.svg-tool{stroke:var(--tool,#79dfc4)}.svg-agent{stroke:var(--agent,#c3adff)}
.label-model{fill:var(--model,#ffbb71)}.label-tool{fill:var(--tool,#79dfc4)}.label-agent{fill:var(--agent,#c3adff)}
.dashed{stroke-dasharray:7 7}.soft{opacity:.6}
</style><defs><marker id="arrow-acp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--dim,#adb9c6)"/></marker></defs><rect x="0" y="100" width="270" height="120" rx="12" class="svg-node "/><text x="135.0" y="156.0" text-anchor="middle" class="svg-title">Your editor</text><text x="135.0" y="186.0" text-anchor="middle" class="svg-small">Development experience</text><rect x="405" y="100" width="285" height="120" rx="12" class="svg-node svg-tool"/><text x="547.5" y="156.0" text-anchor="middle" class="svg-title">ACP</text><text x="547.5" y="186.0" text-anchor="middle" class="svg-small">Agent Client Protocol</text><path d="M270 160 L405 160" class="edge svg-tool " marker-end="url(#arrow-acp)"/><path d="M690 160 L825 160" class="edge svg-tool " marker-end="url(#arrow-acp)"/><g class="fragment fade-out" data-fragment-index="0"><rect x="825" y="100" width="270" height="120" rx="12" class="svg-node "/><text x="960.0" y="156.0" text-anchor="middle" class="svg-title">Coding agent A</text><text x="960.0" y="186.0" text-anchor="middle" class="svg-small">Compatible implementation</text></g><g class="fragment " data-fragment-index="0"><rect x="825" y="100" width="270" height="120" rx="12" class="svg-node svg-tool"/><text x="960.0" y="156.0" text-anchor="middle" class="svg-title">Coding agent B</text><text x="960.0" y="186.0" text-anchor="middle" class="svg-small">Compatible implementation</text></g><text x="135" y="280" text-anchor="middle" class="svg-mono">KEEP THE CLIENT</text><text x="960" y="280" text-anchor="middle" class="svg-mono label-tool">SWAP THE AGENT</text></svg>