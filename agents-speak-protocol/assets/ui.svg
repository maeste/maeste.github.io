<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 325" class="diagram-svg" role="img" aria-labelledby="title-ui desc-ui"><title id="title-ui">Ui</title><desc id="desc-ui">AG-UI carries event and state exchange between agent backend and frontend. A conceptual incident panel gives the human a choice. A2UI describes components; MCP Apps supplies tool UI within a host. These are separate optional contracts.</desc><style>
.svg-node{fill:var(--surface,#16212c);stroke:var(--line,#3c4d5f);stroke-width:1.6}
.svg-title{fill:var(--ink,#f2efe7);font:600 24px system-ui,sans-serif;letter-spacing:-.4px}
.svg-small{fill:var(--dim,#adb9c6);font:18px system-ui,sans-serif}
.svg-mono{fill:var(--dim,#adb9c6);font:16px ui-monospace,monospace}
.svg-large{fill:var(--ink,#f2efe7);font:600 42px system-ui,sans-serif;letter-spacing:-1px}
.edge{fill:none;stroke:var(--line,#3c4d5f);stroke-width:2}
.svg-model{stroke:var(--model,#ffbb71)}.svg-tool{stroke:var(--tool,#79dfc4)}.svg-agent{stroke:var(--agent,#c3adff)}
.label-model{fill:var(--model,#ffbb71)}.label-tool{fill:var(--tool,#79dfc4)}.label-agent{fill:var(--agent,#c3adff)}
.dashed{stroke-dasharray:7 7}.soft{opacity:.6}
</style><defs><marker id="arrow-ui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--dim,#adb9c6)"/></marker></defs><rect x="0" y="115" width="230" height="110" rx="12" class="svg-node "/><text x="115.0" y="166.0" text-anchor="middle" class="svg-title">Agent runtime</text><text x="115.0" y="196.0" text-anchor="middle" class="svg-small">Work in progress</text><path d="M230 170 L440 170" class="edge  " marker-end="url(#arrow-ui)"/><text x="335" y="144" text-anchor="middle" class="svg-mono label-tool">AG-UI</text><rect x="440" y="115" width="215" height="110" rx="12" class="svg-node "/><text x="547.5" y="166.0" text-anchor="middle" class="svg-title">Frontend</text><text x="547.5" y="196.0" text-anchor="middle" class="svg-small">Events + state</text><path d="M655 170 L790 170" class="edge  " marker-end="url(#arrow-ui)"/><g class="fragment " data-fragment-index="0"><rect x="790" y="0" width="300" height="315" rx="16" class="svg-node"/><text x="820" y="38" text-anchor="start" class="svg-mono">INCIDENT PANEL</text><path d="M810 58 L1070 58" class="edge  "/><text x="820" y="96" text-anchor="start" class="svg-small label-tool">Evidence collected</text><text x="820" y="141" text-anchor="start" class="svg-title">Next action?</text><rect x="817" y="179" width="246" height="55" rx="12" class="svg-node svg-tool"/><text x="940.0" y="214.5" text-anchor="middle" class="svg-small">Inspect recent deploy</text><rect x="817" y="247" width="246" height="45" rx="12" class="svg-node "/><text x="940.0" y="277.5" text-anchor="middle" class="svg-small">Ask for more evidence</text></g></svg>