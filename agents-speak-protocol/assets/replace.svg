</style><defs><marker id="arrow-replace" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--dim,#adb9c6)"/></marker></defs><rect x="25" y="120" width="270" height="110" rx="12" class="svg-node "/><text x="160.0" y="171.0" text-anchor="middle" class="svg-title">Your application</text><text x="160.0" y="201.0" text-anchor="middle" class="svg-small">Integration stays</text><rect x="435" y="120" width="240" height="110" rx="12" class="svg-node "/><text x="555.0" y="171.0" text-anchor="middle" class="svg-title">Shared contract</text><text x="555.0" y="201.0" text-anchor="middle" class="svg-small">Boundary</text><path d="M295 175 L435 175" class="edge  " marker-end="url(#arrow-replace)"/><path d="M675 175 L805 175" class="edge  " marker-end="url(#arrow-replace)"/><g class="fragment fade-out" data-fragment-index="0"><rect x="805" y="120" width="270" height="110" rx="12" class="svg-node svg-model"/><text x="940.0" y="171.0" text-anchor="middle" class="svg-title">Implementation A</text><text x="940.0" y="201.0" text-anchor="middle" class="svg-small">Replaceable side</text></g><g class="fragment " data-fragment-index="0"><rect x="805" y="120" width="270" height="110" rx="12" class="svg-node svg-tool"/><text x="940.0" y="171.0" text-anchor="middle" class="svg-title">Implementation B</text><text x="940.0" y="201.0" text-anchor="middle" class="svg-small">Same interface</text></g><text x="160" y="90" text-anchor="middle" class="svg-mono">KEEP</text><text x="555" y="90" text-anchor="middle" class="svg-mono">KEEP</text><text x="940" y="90" text-anchor="middle" class="svg-mono">SWAP</text></svg>