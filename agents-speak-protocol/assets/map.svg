<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 355" class="diagram-svg" role="img" aria-labelledby="title-map desc-map"><title id="title-map">Map</title><desc id="desc-map">Three primary boundaries: models through Open Responses, capabilities through MCP, counterparts through A2A. Five additional boundaries: users, knowledge, operations, IDE, payments.</desc><style>
.svg-node{fill:var(--surface,#16212c);stroke:var(--line,#3c4d5f);stroke-width:1.6}
.svg-title{fill:var(--ink,#f2efe7);font:600 24px system-ui,sans-serif;letter-spacing:-.4px}
.svg-small{fill:var(--dim,#adb9c6);font:18px system-ui,sans-serif}
.svg-mono{fill:var(--dim,#adb9c6);font:16px ui-monospace,monospace}
.svg-large{fill:var(--ink,#f2efe7);font:600 42px system-ui,sans-serif;letter-spacing:-1px}
.edge{fill:none;stroke:var(--line,#3c4d5f);stroke-width:2}
.svg-model{stroke:var(--model,#ffbb71)}.svg-tool{stroke:var(--tool,#79dfc4)}.svg-agent{stroke:var(--agent,#c3adff)}
.label-model{fill:var(--model,#ffbb71)}.label-tool{fill:var(--tool,#79dfc4)}.label-agent{fill:var(--agent,#c3adff)}
.dashed{stroke-dasharray:7 7}.soft{opacity:.6}
</style><defs><marker id="arrow-map" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--dim,#adb9c6)"/></marker></defs><rect x="10" y="0" width="300" height="92" rx="12" class="svg-node svg-model"/><text x="160.0" y="42.0" text-anchor="middle" class="svg-title">Models</text><text x="160.0" y="72.0" text-anchor="middle" class="svg-small">Open Responses</text><path d="M160 92 L160 115 L550 115 L550 148" class="edge svg-model"/><rect x="400" y="0" width="300" height="92" rx="12" class="svg-node svg-tool"/><text x="550.0" y="42.0" text-anchor="middle" class="svg-title">Capabilities</text><text x="550.0" y="72.0" text-anchor="middle" class="svg-small">MCP</text><path d="M550 92 L550 115 L550 115 L550 148" class="edge svg-tool"/><rect x="790" y="0" width="300" height="92" rx="12" class="svg-node svg-agent"/><text x="940.0" y="42.0" text-anchor="middle" class="svg-title">Counterparts</text><text x="940.0" y="72.0" text-anchor="middle" class="svg-small">A2A</text><path d="M940 92 L940 115 L550 115 L550 148" class="edge svg-agent"/><rect x="425" y="150" width="250" height="62" rx="12" class="svg-node svg-tool"/><text x="550.0" y="189.0" text-anchor="middle" class="svg-title">AGENT</text><g class="fragment " data-fragment-index="0"><path d="M550 212 L550 240 L110 240 L110 267" class="edge "/><rect x="10" y="268" width="200" height="84" rx="12" class="svg-node "/><text x="110.0" y="306.0" text-anchor="middle" class="svg-title">Users</text><text x="110.0" y="336.0" text-anchor="middle" class="svg-small">AG-UI / A2UI</text><path d="M550 212 L550 240 L330 240 L330 267" class="edge "/><rect x="230" y="268" width="200" height="84" rx="12" class="svg-node "/><text x="330.0" y="306.0" text-anchor="middle" class="svg-title">Knowledge</text><text x="330.0" y="336.0" text-anchor="middle" class="svg-small">Files / Skills / Plugins</text><path d="M550 212 L550 240 L550 240 L550 267" class="edge "/><rect x="450" y="268" width="200" height="84" rx="12" class="svg-node "/><text x="550.0" y="306.0" text-anchor="middle" class="svg-title">Operations</text><text x="550.0" y="336.0" text-anchor="middle" class="svg-small">OTel GenAI</text><path d="M550 212 L550 240 L770 240 L770 267" class="edge "/><rect x="670" y="268" width="200" height="84" rx="12" class="svg-node "/><text x="770.0" y="306.0" text-anchor="middle" class="svg-title">IDE</text><text x="770.0" y="336.0" text-anchor="middle" class="svg-small">ACP</text><path d="M550 212 L550 240 L990 240 L990 267" class="edge "/><rect x="890" y="268" width="200" height="84" rx="12" class="svg-node "/><text x="990.0" y="306.0" text-anchor="middle" class="svg-title">Payments</text><text x="990.0" y="336.0" text-anchor="middle" class="svg-small">x402</text></g></svg>