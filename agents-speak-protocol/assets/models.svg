<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 345" class="diagram-svg" role="img" aria-labelledby="title-models desc-models"><title id="title-models">Models</title><desc id="desc-models">A shared model interface allows one agent integration to reach compatible providers and local models. Provider support must be checked.</desc><style>
.svg-node{fill:var(--surface,#16212c);stroke:var(--line,#3c4d5f);stroke-width:1.6}
.svg-title{fill:var(--ink,#f2efe7);font:600 24px system-ui,sans-serif;letter-spacing:-.4px}
.svg-small{fill:var(--dim,#adb9c6);font:18px system-ui,sans-serif}
.svg-mono{fill:var(--dim,#adb9c6);font:16px ui-monospace,monospace}
.svg-large{fill:var(--ink,#f2efe7);font:600 42px system-ui,sans-serif;letter-spacing:-1px}
.edge{fill:none;stroke:var(--line,#3c4d5f);stroke-width:2}
.svg-model{stroke:var(--model,#ffbb71)}.svg-tool{stroke:var(--tool,#79dfc4)}.svg-agent{stroke:var(--agent,#c3adff)}
.label-model{fill:var(--model,#ffbb71)}.label-tool{fill:var(--tool,#79dfc4)}.label-agent{fill:var(--agent,#c3adff)}
.dashed{stroke-dasharray:7 7}.soft{opacity:.6}
</style><defs><marker id="arrow-models" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--dim,#adb9c6)"/></marker></defs><rect x="10" y="90" width="230" height="140" rx="12" class="svg-node "/><text x="125.0" y="156.0" text-anchor="middle" class="svg-title">Your agent</text><text x="125.0" y="186.0" text-anchor="middle" class="svg-small">Model adapter</text><rect x="345" y="100" width="330" height="120" rx="12" class="svg-node svg-model"/><text x="510.0" y="156.0" text-anchor="middle" class="svg-title">Open Responses</text><text x="510.0" y="186.0" text-anchor="middle" class="svg-small">Shared interface</text><path d="M240 160 L345 160" class="edge svg-model " marker-end="url(#arrow-models)"/><path d="M675 160 L740 160 L740 45 L800 45" class="edge svg-model" marker-end="url(#arrow-models)"/><rect x="800" y="0" width="280" height="90" rx="12" class="svg-node svg-model"/><text x="940.0" y="41.0" text-anchor="middle" class="svg-title">Provider A</text><text x="940.0" y="71.0" text-anchor="middle" class="svg-small">Compatible subset</text><path d="M675 160 L740 160 L740 170 L800 170" class="edge svg-model" marker-end="url(#arrow-models)"/><rect x="800" y="125" width="280" height="90" rx="12" class="svg-node svg-model"/><text x="940.0" y="166.0" text-anchor="middle" class="svg-title">Provider B</text><text x="940.0" y="196.0" text-anchor="middle" class="svg-small">Compatible subset</text><path d="M675 160 L740 160 L740 295 L800 295" class="edge svg-model" marker-end="url(#arrow-models)"/><rect x="800" y="250" width="280" height="90" rx="12" class="svg-node svg-model"/><text x="940.0" y="291.0" text-anchor="middle" class="svg-title">Local model</text><text x="940.0" y="321.0" text-anchor="middle" class="svg-small">Compatible subset</text></svg>