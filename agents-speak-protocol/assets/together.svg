<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 370" class="diagram-svg" role="img" aria-labelledby="title-together desc-together"><title id="title-together">Together</title><desc id="desc-together">The incident coordinator accesses logs through MCP and delegates a diagnosis to a payments agent through A2A. The remote agent can use MCP for its own tools. Each integration crosses a different boundary.</desc><style>
.svg-node{fill:var(--surface,#16212c);stroke:var(--line,#3c4d5f);stroke-width:1.6}
.svg-title{fill:var(--ink,#f2efe7);font:600 24px system-ui,sans-serif;letter-spacing:-.4px}
.svg-small{fill:var(--dim,#adb9c6);font:18px system-ui,sans-serif}
.svg-mono{fill:var(--dim,#adb9c6);font:16px ui-monospace,monospace}
.svg-large{fill:var(--ink,#f2efe7);font:600 42px system-ui,sans-serif;letter-spacing:-1px}
.edge{fill:none;stroke:var(--line,#3c4d5f);stroke-width:2}
.svg-model{stroke:var(--model,#ffbb71)}.svg-tool{stroke:var(--tool,#79dfc4)}.svg-agent{stroke:var(--agent,#c3adff)}
.label-model{fill:var(--model,#ffbb71)}.label-tool{fill:var(--tool,#79dfc4)}.label-agent{fill:var(--agent,#c3adff)}
.dashed{stroke-dasharray:7 7}.soft{opacity:.6}
</style><defs><marker id="arrow-together" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--dim,#adb9c6)"/></marker></defs><rect x="0" y="150" width="270" height="115" rx="12" class="svg-node "/><text x="135.0" y="203.5" text-anchor="middle" class="svg-title">Incident agent</text><text x="135.0" y="233.5" text-anchor="middle" class="svg-small">Your application</text><g class="fragment " data-fragment-index="0"><path d="M135 150 L135 85" class="edge svg-tool " marker-end="url(#arrow-together)"/><rect x="0" y="0" width="270" height="85" rx="12" class="svg-node svg-tool"/><text x="135.0" y="38.5" text-anchor="middle" class="svg-title">Logs / deploys</text><text x="135.0" y="68.5" text-anchor="middle" class="svg-small">MCP server</text><text x="195" y="125" text-anchor="middle" class="svg-mono label-tool">MCP</text></g><g class="fragment " data-fragment-index="1"><path d="M270 207 L560 207" class="edge svg-agent " marker-end="url(#arrow-together)"/><text x="415" y="180" text-anchor="middle" class="svg-mono label-agent">A2A</text><rect x="560" y="0" width="535" height="360" rx="18" class="svg-node svg-agent"/><text x="590" y="38" text-anchor="start" class="svg-mono label-agent">PAYMENTS TEAM</text><rect x="660" y="150" width="335" height="110" rx="12" class="svg-node svg-agent"/><text x="827.5" y="201.0" text-anchor="middle" class="svg-title">Payments agent</text><text x="827.5" y="231.0" text-anchor="middle" class="svg-small">Outcome: diagnosis</text><text x="825" y="305" text-anchor="middle" class="svg-small">Private model / context / strategy</text></g><g class="fragment " data-fragment-index="2"><rect x="680" y="62" width="295" height="65" rx="12" class="svg-node svg-tool"/><text x="827.5" y="102.5" text-anchor="middle" class="svg-title">Payments tools</text><path d="M825 150 L825 127" class="edge svg-tool " marker-end="url(#arrow-together)"/><text x="905" y="144" text-anchor="middle" class="svg-mono label-tool">MCP</text></g></svg>