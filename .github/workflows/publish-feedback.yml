name: Publish feedback

on:
  schedule:
    # every 30 minutes (public repo -> unlimited Actions minutes)
    - cron: '*/30 * * * *'
  workflow_dispatch: {} # manual "Run workflow" button

permissions:
  contents: write      # push the feedback branch + merge its PR
  pull-requests: write # create + merge the auto PR

concurrency:
  group: publish-feedback
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch approved feedback and write JSON
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/publish-feedback.mjs

      - name: Publish via auto-merge PR (main is protected)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/feedback/*.json
          if git diff --cached --quiet; then
            echo "No feedback changes to publish."
            exit 0
          fi

          # main is protected (requires PR). Push to an ephemeral branch and
          # auto-merge it — the sanctioned path, so no protection change needed.
          BRANCH=bot/feedback
          git checkout -B "$BRANCH"
          git commit -m "chore(feedback): publish approved feedback"
          git push --force-with-lease origin "$BRANCH"

          gh pr create --base main --head "$BRANCH" \
            --title "chore(feedback): publish approved feedback" \
            --body "Auto-generated by the publish-feedback workflow." || true

          gh pr merge "$BRANCH" --squash --delete-branch
