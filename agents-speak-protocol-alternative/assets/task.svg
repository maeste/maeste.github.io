<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 335" class="diagram-svg" role="img" aria-labelledby="title-task desc-task"><title id="title-task">Task</title><desc id="desc-task">Illustrative A2A task: submitted, working, input-required. The client supplies more input, the task resumes working and completes with a diagnosis artifact.</desc><style>
.svg-node{fill:var(--surface,#16212c);stroke:var(--line,#3c4d5f);stroke-width:1.6}
.svg-title{fill:var(--ink,#f2efe7);font:600 24px system-ui,sans-serif;letter-spacing:-.4px}
.svg-small{fill:var(--dim,#adb9c6);font:18px system-ui,sans-serif}
.svg-mono{fill:var(--dim,#adb9c6);font:16px ui-monospace,monospace}
.svg-large{fill:var(--ink,#f2efe7);font:600 42px system-ui,sans-serif;letter-spacing:-1px}
.edge{fill:none;stroke:var(--line,#3c4d5f);stroke-width:2}
.svg-model{stroke:var(--model,#ffbb71)}.svg-tool{stroke:var(--tool,#79dfc4)}.svg-agent{stroke:var(--agent,#c3adff)}
.label-model{fill:var(--model,#ffbb71)}.label-tool{fill:var(--tool,#79dfc4)}.label-agent{fill:var(--agent,#c3adff)}
.dashed{stroke-dasharray:7 7}.soft{opacity:.6}
</style><defs><marker id="arrow-task" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--dim,#adb9c6)"/></marker></defs><rect x="0" y="140" width="190" height="75" rx="12" class="svg-node svg-agent"/><text x="95.0" y="185.5" text-anchor="middle" class="svg-title">submitted</text><g class="fragment " data-fragment-index="0"><path d="M190 178 L270 178" class="edge svg-agent " marker-end="url(#arrow-task)"/><rect x="270" y="140" width="190" height="75" rx="12" class="svg-node svg-agent"/><text x="365.0" y="185.5" text-anchor="middle" class="svg-title">working</text></g><g class="fragment " data-fragment-index="1"><path d="M460 178 L560 178" class="edge svg-agent " marker-end="url(#arrow-task)"/><rect x="560" y="140" width="240" height="75" rx="12" class="svg-node svg-agent"/><text x="680.0" y="185.5" text-anchor="middle" class="svg-title">input-required</text><text x="680" y="100" text-anchor="middle" class="svg-small label-agent">“Correlation ID?”</text><rect x="565" y="258" width="230" height="60" rx="12" class="svg-node "/><text x="680.0" y="296.0" text-anchor="middle" class="svg-small">Client supplies input</text><path d="M680 215 L680 258" class="edge svg-agent "/></g><g class="fragment " data-fragment-index="2"><path d="M565 289 L370 289 L370 215" class="edge svg-agent" marker-end="url(#arrow-task)"/><path d="M460 155 L510 155 L510 50 L960 50 L960 140" class="edge svg-agent" marker-end="url(#arrow-task)"/><rect x="865" y="140" width="230" height="75" rx="12" class="svg-node svg-agent"/><text x="980.0" y="185.5" text-anchor="middle" class="svg-title">completed</text><text x="980" y="264" text-anchor="middle" class="svg-small label-agent">Diagnosis + evidence</text><text x="980" y="297" text-anchor="middle" class="svg-mono label-agent">Artifact</text></g></svg>