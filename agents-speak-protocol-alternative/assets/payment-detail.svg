<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" class="diagram-svg" role="img" aria-labelledby="title-payment-detail desc-payment-detail"><title id="title-payment-detail">Payment Detail</title><desc id="desc-payment-detail">Illustrative x402 V2 exact payment: request; 402 Payment-Required; authorize; retry with Payment-Signature; server verifies and settles, optionally using a facilitator; resource and Payment-Response.</desc><style>
.svg-node{fill:var(--surface,#16212c);stroke:var(--line,#3c4d5f);stroke-width:1.6}
.svg-title{fill:var(--ink,#f2efe7);font:600 24px system-ui,sans-serif;letter-spacing:-.4px}
.svg-small{fill:var(--dim,#adb9c6);font:18px system-ui,sans-serif}
.svg-mono{fill:var(--dim,#adb9c6);font:16px ui-monospace,monospace}
.svg-large{fill:var(--ink,#f2efe7);font:600 42px system-ui,sans-serif;letter-spacing:-1px}
.edge{fill:none;stroke:var(--line,#3c4d5f);stroke-width:2}
.svg-model{stroke:var(--model,#ffbb71)}.svg-tool{stroke:var(--tool,#79dfc4)}.svg-agent{stroke:var(--agent,#c3adff)}
.label-model{fill:var(--model,#ffbb71)}.label-tool{fill:var(--tool,#79dfc4)}.label-agent{fill:var(--agent,#c3adff)}
.dashed{stroke-dasharray:7 7}.soft{opacity:.6}
</style><defs><marker id="arrow-payment-detail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--dim,#adb9c6)"/></marker></defs><text x="110" y="28" text-anchor="middle" class="svg-mono">CLIENT</text><text x="630" y="28" text-anchor="middle" class="svg-mono">SERVER</text><text x="985" y="28" text-anchor="middle" class="svg-mono">FACILITATOR</text><text x="985" y="48" text-anchor="middle" class="svg-mono">(optional)</text><path d="M110 50 L110 380" class="edge  dashed"/><path d="M630 50 L630 380" class="edge  dashed"/><path d="M985 50 L985 380" class="edge  dashed"/><path d="M110 90 L630 90" class="edge svg-model " marker-end="url(#arrow-payment-detail)"/><text x="370.0" y="80" text-anchor="middle" class="svg-small">Request resource</text><path d="M630 145 L110 145" class="edge svg-model " marker-end="url(#arrow-payment-detail)"/><text x="370.0" y="135" text-anchor="middle" class="svg-small">402 + PAYMENT-REQUIRED</text><path d="M110 225 L630 225" class="edge svg-model " marker-end="url(#arrow-payment-detail)"/><text x="370.0" y="215" text-anchor="middle" class="svg-small">Retry + PAYMENT-SIGNATURE</text><path d="M630 275 L985 275" class="edge svg-model " marker-end="url(#arrow-payment-detail)"/><text x="807.5" y="265" text-anchor="middle" class="svg-small">Verify / settle</text><path d="M985 310 L630 310" class="edge svg-model " marker-end="url(#arrow-payment-detail)"/><text x="807.5" y="300" text-anchor="middle" class="svg-small">Settlement result</text><path d="M630 370 L110 370" class="edge svg-model " marker-end="url(#arrow-payment-detail)"/><text x="370.0" y="360" text-anchor="middle" class="svg-small">Resource + PAYMENT-RESPONSE</text><text x="110" y="193" text-anchor="middle" class="svg-small label-model">Sign authorization</text></svg>