<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 570 500" class="diagram-svg" role="img" aria-labelledby="title-cover desc-cover"><title id="title-cover">Cover</title><desc id="desc-cover">An agent connects to models, tools, other agents, users, an IDE and context through separate boundaries.</desc><style>
.svg-node{fill:var(--surface,#16212c);stroke:var(--line,#3c4d5f);stroke-width:1.6}
.svg-title{fill:var(--ink,#f2efe7);font:600 24px system-ui,sans-serif;letter-spacing:-.4px}
.svg-small{fill:var(--dim,#adb9c6);font:18px system-ui,sans-serif}
.svg-mono{fill:var(--dim,#adb9c6);font:16px ui-monospace,monospace}
.svg-large{fill:var(--ink,#f2efe7);font:600 42px system-ui,sans-serif;letter-spacing:-1px}
.edge{fill:none;stroke:var(--line,#3c4d5f);stroke-width:2}
.svg-model{stroke:var(--model,#ffbb71)}.svg-tool{stroke:var(--tool,#79dfc4)}.svg-agent{stroke:var(--agent,#c3adff)}
.label-model{fill:var(--model,#ffbb71)}.label-tool{fill:var(--tool,#79dfc4)}.label-agent{fill:var(--agent,#c3adff)}
.dashed{stroke-dasharray:7 7}.soft{opacity:.6}
</style><defs><marker id="arrow-cover" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--dim,#adb9c6)"/></marker></defs><circle cx="285" cy="245" r="100" class="edge soft"/><circle cx="285" cy="245" r="175" class="edge soft"/><circle cx="285" cy="245" r="235" class="edge soft"/><path d="M285 245 L285 25" class="edge  dashed"/><path d="M285 245 L485 130" class="edge  dashed"/><path d="M285 245 L485 355" class="edge  dashed"/><path d="M285 245 L285 465" class="edge  dashed"/><path d="M285 245 L85 355" class="edge  dashed"/><path d="M285 245 L85 130" class="edge  dashed"/><rect x="200" y="208" width="170" height="74" rx="12" class="svg-node svg-tool"/><text x="285.0" y="253.0" text-anchor="middle" class="svg-title">AGENT</text><rect x="205" y="8" width="154" height="65" rx="12" class="svg-node svg-model"/><text x="282.0" y="48.5" text-anchor="middle" class="svg-title">Models</text><rect x="410" y="96" width="154" height="65" rx="12" class="svg-node svg-tool"/><text x="487.0" y="136.5" text-anchor="middle" class="svg-title">Tools</text><rect x="403" y="332" width="154" height="65" rx="12" class="svg-node svg-agent"/><text x="480.0" y="372.5" text-anchor="middle" class="svg-title">Agents</text><rect x="210" y="430" width="154" height="65" rx="12" class="svg-node "/><text x="287.0" y="470.5" text-anchor="middle" class="svg-title">Users</text><rect x="6" y="332" width="154" height="65" rx="12" class="svg-node "/><text x="83.0" y="372.5" text-anchor="middle" class="svg-title">IDE</text><rect x="0" y="96" width="154" height="65" rx="12" class="svg-node "/><text x="77.0" y="136.5" text-anchor="middle" class="svg-title">Context</text></svg>