<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 345" class="diagram-svg" role="img" aria-labelledby="title-network desc-network"><title id="title-network">Network</title><desc id="desc-network">Compatible hosts share an MCP integration point. Adding another capability provider creates more possible connections without a bespoke adapter for each host.</desc><style>
.svg-node{fill:var(--surface,#16212c);stroke:var(--line,#3c4d5f);stroke-width:1.6}
.svg-title{fill:var(--ink,#f2efe7);font:600 24px system-ui,sans-serif;letter-spacing:-.4px}
.svg-small{fill:var(--dim,#adb9c6);font:18px system-ui,sans-serif}
.svg-mono{fill:var(--dim,#adb9c6);font:16px ui-monospace,monospace}
.svg-large{fill:var(--ink,#f2efe7);font:600 42px system-ui,sans-serif;letter-spacing:-1px}
.edge{fill:none;stroke:var(--line,#3c4d5f);stroke-width:2}
.svg-model{stroke:var(--model,#ffbb71)}.svg-tool{stroke:var(--tool,#79dfc4)}.svg-agent{stroke:var(--agent,#c3adff)}
.label-model{fill:var(--model,#ffbb71)}.label-tool{fill:var(--tool,#79dfc4)}.label-agent{fill:var(--agent,#c3adff)}
.dashed{stroke-dasharray:7 7}.soft{opacity:.6}
</style><defs><marker id="arrow-network" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--dim,#adb9c6)"/></marker></defs><text x="130" y="25" text-anchor="middle" class="svg-mono">COMPATIBLE HOSTS</text><text x="960" y="25" text-anchor="middle" class="svg-mono">CAPABILITY PROVIDERS</text><rect x="430" y="95" width="240" height="155" rx="12" class="svg-node svg-tool"/><text x="550.0" y="168.5" text-anchor="middle" class="svg-title">MCP</text><text x="550.0" y="198.5" text-anchor="middle" class="svg-small">Shared interface</text><rect x="10" y="50" width="240" height="70" rx="12" class="svg-node "/><text x="130.0" y="93.0" text-anchor="middle" class="svg-title">Chat app</text><path d="M250 85 L430 172" class="edge svg-tool "/><rect x="10" y="150" width="240" height="70" rx="12" class="svg-node "/><text x="130.0" y="193.0" text-anchor="middle" class="svg-title">IDE host</text><path d="M250 185 L430 172" class="edge svg-tool "/><rect x="10" y="250" width="240" height="70" rx="12" class="svg-node "/><text x="130.0" y="293.0" text-anchor="middle" class="svg-title">Agent runtime</text><path d="M250 285 L430 172" class="edge svg-tool "/><path d="M670 172 L830 105" class="edge svg-tool "/><rect x="830" y="70" width="260" height="70" rx="12" class="svg-node svg-tool"/><text x="960.0" y="113.0" text-anchor="middle" class="svg-title">Repository</text><path d="M670 172 L830 265" class="edge svg-tool "/><rect x="830" y="230" width="260" height="70" rx="12" class="svg-node svg-tool"/><text x="960.0" y="273.0" text-anchor="middle" class="svg-title">Observability</text><g class="fragment " data-fragment-index="0"><path d="M670 172 L830 185" class="edge svg-tool "/><rect x="830" y="150" width="260" height="70" rx="12" class="svg-node svg-tool"/><text x="960.0" y="193.0" text-anchor="middle" class="svg-title">One more server</text></g></svg>