<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" class="diagram-svg" role="img" aria-labelledby="title-payment desc-payment"><title id="title-payment">Payment</title><desc id="desc-payment">x402 conceptual sequence: client requests a resource, server returns 402 with terms, client authorizes and retries, server verifies and settles before delivery.</desc><style>
.svg-node{fill:var(--surface,#16212c);stroke:var(--line,#3c4d5f);stroke-width:1.6}
.svg-title{fill:var(--ink,#f2efe7);font:600 24px system-ui,sans-serif;letter-spacing:-.4px}
.svg-small{fill:var(--dim,#adb9c6);font:18px system-ui,sans-serif}
.svg-mono{fill:var(--dim,#adb9c6);font:16px ui-monospace,monospace}
.svg-large{fill:var(--ink,#f2efe7);font:600 42px system-ui,sans-serif;letter-spacing:-1px}
.edge{fill:none;stroke:var(--line,#3c4d5f);stroke-width:2}
.svg-model{stroke:var(--model,#ffbb71)}.svg-tool{stroke:var(--tool,#79dfc4)}.svg-agent{stroke:var(--agent,#c3adff)}
.label-model{fill:var(--model,#ffbb71)}.label-tool{fill:var(--tool,#79dfc4)}.label-agent{fill:var(--agent,#c3adff)}
.dashed{stroke-dasharray:7 7}.soft{opacity:.6}
</style><defs><marker id="arrow-payment" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--dim,#adb9c6)"/></marker></defs><rect x="0" y="25" width="245" height="100" rx="12" class="svg-node "/><text x="122.5" y="71.0" text-anchor="middle" class="svg-title">Agent / client</text><text x="122.5" y="101.0" text-anchor="middle" class="svg-small">Request resource</text><g class="fragment " data-fragment-index="0"><path d="M245 75 L420 75" class="edge svg-model " marker-end="url(#arrow-payment)"/><rect x="420" y="25" width="260" height="100" rx="12" class="svg-node svg-model"/><text x="550.0" y="71.0" text-anchor="middle" class="svg-title">402 + terms</text><text x="550.0" y="101.0" text-anchor="middle" class="svg-small">Payment requirements</text></g><g class="fragment " data-fragment-index="1"><path d="M680 75 L845 75" class="edge svg-model " marker-end="url(#arrow-payment)"/><rect x="845" y="25" width="250" height="100" rx="12" class="svg-node svg-model"/><text x="970.0" y="71.0" text-anchor="middle" class="svg-title">Authorize + retry</text><text x="970.0" y="101.0" text-anchor="middle" class="svg-small">Signed payment payload</text><path d="M970 125 L970 165 L125 165 L125 198" class="edge svg-model" marker-end="url(#arrow-payment)"/><rect x="0" y="200" width="1095" height="65" rx="12" class="svg-node svg-model"/><text x="547.5" y="240.5" text-anchor="middle" class="svg-small">Server verifies &amp; settles, then delivers the resource</text></g></svg>