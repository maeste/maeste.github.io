<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 345" class="diagram-svg" role="img" aria-labelledby="title-a2a desc-a2a"><title id="title-a2a">A2A</title><desc id="desc-a2a">The incident coordinator addresses a remote payments agent. An Agent Card describes the endpoint. Model, tools and memory remain internal to the payments team.</desc><style>
.svg-node{fill:var(--surface,#16212c);stroke:var(--line,#3c4d5f);stroke-width:1.6}
.svg-title{fill:var(--ink,#f2efe7);font:600 24px system-ui,sans-serif;letter-spacing:-.4px}
.svg-small{fill:var(--dim,#adb9c6);font:18px system-ui,sans-serif}
.svg-mono{fill:var(--dim,#adb9c6);font:16px ui-monospace,monospace}
.svg-large{fill:var(--ink,#f2efe7);font:600 42px system-ui,sans-serif;letter-spacing:-1px}
.edge{fill:none;stroke:var(--line,#3c4d5f);stroke-width:2}
.svg-model{stroke:var(--model,#ffbb71)}.svg-tool{stroke:var(--tool,#79dfc4)}.svg-agent{stroke:var(--agent,#c3adff)}
.label-model{fill:var(--model,#ffbb71)}.label-tool{fill:var(--tool,#79dfc4)}.label-agent{fill:var(--agent,#c3adff)}
.dashed{stroke-dasharray:7 7}.soft{opacity:.6}
</style><defs><marker id="arrow-a2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--dim,#adb9c6)"/></marker></defs><rect x="15" y="100" width="270" height="135" rx="12" class="svg-node "/><text x="150.0" y="163.5" text-anchor="middle" class="svg-title">Client agent</text><text x="150.0" y="193.5" text-anchor="middle" class="svg-small">Incident coordinator</text><path d="M285 168 L550 168" class="edge svg-agent " marker-end="url(#arrow-a2a)"/><text x="410" y="144" text-anchor="middle" class="svg-mono label-agent">A2A</text><rect x="550" y="15" width="535" height="315" rx="18" class="svg-node svg-agent"/><text x="578" y="50" text-anchor="start" class="svg-mono label-agent">PAYMENTS TEAM / OWN BOUNDARY</text><rect x="675" y="110" width="285" height="105" rx="12" class="svg-node svg-agent"/><text x="817.5" y="158.5" text-anchor="middle" class="svg-title">Remote agent</text><text x="817.5" y="188.5" text-anchor="middle" class="svg-small">Owns the diagnosis</text><g class="fragment " data-fragment-index="0"><rect x="345" y="20" width="170" height="75" rx="12" class="svg-node "/><text x="430.0" y="53.5" text-anchor="middle" class="svg-small">Agent Card</text><text x="430.0" y="83.5" text-anchor="middle" class="svg-small">Discovery</text><path d="M515 58 L640 105" class="edge svg-agent "/></g><g class="fragment " data-fragment-index="1"><text x="818" y="252" text-anchor="middle" class="svg-small">Internal implementation</text><text x="818" y="293" text-anchor="middle" class="svg-mono">Model / tools / memory</text></g></svg>