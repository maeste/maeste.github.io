<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 345" class="diagram-svg" role="img" aria-labelledby="title-mcp desc-mcp"><title id="title-mcp">Mcp</title><desc id="desc-mcp">An AI host owns model, policy and user experience. Its MCP client connects to a server that exposes primitives and adapts an existing domain API.</desc><style>
.svg-node{fill:var(--surface,#16212c);stroke:var(--line,#3c4d5f);stroke-width:1.6}
.svg-title{fill:var(--ink,#f2efe7);font:600 24px system-ui,sans-serif;letter-spacing:-.4px}
.svg-small{fill:var(--dim,#adb9c6);font:18px system-ui,sans-serif}
.svg-mono{fill:var(--dim,#adb9c6);font:16px ui-monospace,monospace}
.svg-large{fill:var(--ink,#f2efe7);font:600 42px system-ui,sans-serif;letter-spacing:-1px}
.edge{fill:none;stroke:var(--line,#3c4d5f);stroke-width:2}
.svg-model{stroke:var(--model,#ffbb71)}.svg-tool{stroke:var(--tool,#79dfc4)}.svg-agent{stroke:var(--agent,#c3adff)}
.label-model{fill:var(--model,#ffbb71)}.label-tool{fill:var(--tool,#79dfc4)}.label-agent{fill:var(--agent,#c3adff)}
.dashed{stroke-dasharray:7 7}.soft{opacity:.6}
</style><defs><marker id="arrow-mcp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="var(--dim,#adb9c6)"/></marker></defs><rect x="10" y="20" width="420" height="310" rx="16" class="svg-node svg-tool"/><text x="38" y="55" text-anchor="start" class="svg-mono">HOST / AI APPLICATION</text><rect x="40" y="80" width="155" height="70" rx="12" class="svg-node "/><text x="117.5" y="123.0" text-anchor="middle" class="svg-small">User / policy</text><rect x="230" y="80" width="170" height="70" rx="12" class="svg-node svg-model"/><text x="315.0" y="123.0" text-anchor="middle" class="svg-small">Model</text><rect x="85" y="218" width="270" height="70" rx="12" class="svg-node svg-tool"/><text x="220.0" y="261.0" text-anchor="middle" class="svg-title">MCP client</text><path d="M315 150 L250 218" class="edge svg-tool " marker-end="url(#arrow-mcp)"/><path d="M355 253 L550 253" class="edge svg-tool " marker-end="url(#arrow-mcp)"/><text x="452" y="228" text-anchor="middle" class="svg-mono label-tool">MCP</text><rect x="550" y="190" width="260" height="120" rx="12" class="svg-node svg-tool"/><text x="680.0" y="246.0" text-anchor="middle" class="svg-title">MCP server</text><text x="680.0" y="276.0" text-anchor="middle" class="svg-small">Tools / resources / prompts</text><g class="fragment " data-fragment-index="0"><path d="M810 253 L890 253" class="edge  " marker-end="url(#arrow-mcp)"/><rect x="890" y="200" width="200" height="100" rx="12" class="svg-node "/><text x="990.0" y="246.0" text-anchor="middle" class="svg-title">Domain API</text><text x="990.0" y="276.0" text-anchor="middle" class="svg-small">Logs / deploys</text></g></svg>